# =============================================================================
# 容器内 nginx 配置（由 Dockerfile COPY 到 /etc/nginx/conf.d/default.conf）
#
# 职责：SPA 静态托管 + 安全头 + 健康检查 + 可选 REST 反代。
# Tableau REST 反代需要站点域名：容器里无法从环境变量替换 nginx 配置，
# 因此默认只保留注释模板；生产请在网关层配置（见 docs/deployment.md），
# 或自行用 envsubst 生成配置。嵌入用的 iframe 直连 Tableau，不经过这里。
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 会同时影响下面所有 location（除非某个 location 自己又写了 add_header）
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    # ---- 健康检查（liveness） ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 带 hash 的构建产物：长期缓存 ----
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- 构建清单不对外暴露 ----
    location ^~ /.vite/ {
        deny all;
    }

    # ---- 入口 HTML：no-cache（回滚/发版即时生效） ----
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.online.tableau.com; font-src 'self' data:; connect-src 'self' https://*.online.tableau.com https://*.tableau.com; frame-src https://*.online.tableau.com https://*.tableau.com; frame-ancestors 'self'; form-action 'self'; worker-src 'self' blob:" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # ---- SPA 回退（/login、/t/{slug}/... 深链接刷新不 404） ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Tableau REST 反代（默认注释；生产必须启用） ----
    # 站点域名不能写死在这里：请在编排层用环境变量生成一份配置，或在网关统一反代。
    # 路径必须与应用构建时的 VITE_TABLEAU_API_BASE 一致（默认 /tableau-proxy）。
    #
    # location /tableau-proxy/ {
    #     rewrite ^/tableau-proxy/(.*)$ /$1 break;
    #     proxy_pass https://YOUR_SITE.online.tableau.com;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $proxy_host;
    #     proxy_set_header Connection "";
    #     proxy_ssl_server_name on;
    #     proxy_read_timeout 120s;
    # }
}
