<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau Embed Hub Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Geist', -apple-system, system-ui, sans-serif;
      background: #f5f5f5;
      padding: 2rem;
      line-height: 1.6;
      color: #2d3142;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #2d3142;
    }
    .eyebrow {
      font-family: 'Geist Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7a8399;
      margin-bottom: 0.5rem;
    }
    svg { display: block; margin: 2rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">ARCHITECTURE</p>
    <h1>Tableau Embed Hub Architecture</h1>
    
    <svg viewBox="0 0 800 480" role="img" aria-labelledby="arch-title arch-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="arch-title">Tableau Embed Hub Architecture</title>
      <desc id="arch-desc">Architecture diagram showing browser-side app connecting to Tableau Cloud through REST proxy for API calls and direct iframe embedding for visualizations, with JWT token signing happening in browser.</desc>
      
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>
      
      <!-- Background -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      
      <!-- Zone: Browser -->
      <rect x="40" y="60" width="320" height="360" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="56" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">BROWSER</text>
      
      <!-- Zone: Production -->
      <rect x="440" y="60" width="320" height="360" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="456" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PRODUCTION</text>
      
      <!-- Arrows first (behind boxes) -->
      
      <!-- React App -> JWT Signer -->
      <path d="M 200,156 L 200,188" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
      <rect x="172" y="160" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sign JWT</text>
      
      <!-- JWT Signer -> React App -->
      <path d="M 220,208 L 220,176" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#arrow)" stroke-dasharray="4,3"/>
      <rect x="224" y="180" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">token</text>
      
      <!-- React App -> REST Proxy (primary path) -->
      <path d="M 280,140 L 340,140 Q 348,140 348,148 L 348,228 Q 348,236 356,236 L 460,236" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#arrow-accent)"/>
      <rect x="360" y="214" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="223" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">REST requests</text>
      
      <!-- REST Proxy -> Tableau Cloud -->
      <path d="M 580,236 L 620,236" stroke="#2e5aa8" stroke-width="1.2" fill="none" marker-end="url(#arrow-link)"/>
      <rect x="586" y="214" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="223" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">API</text>
      
      <!-- React App -> Tableau Cloud (iframe embed) -->
      <path d="M 200,156 L 200,40 L 680,40 L 680,316" stroke="#2e5aa8" stroke-width="1.2" fill="none" marker-end="url(#arrow-link)"/>
      <rect x="416" y="22" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="460" y="31" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">iframe embed</text>
      
      <!-- Nodes -->
      
      <!-- React App (focal) -->
      <rect x="100" y="120" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="120" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="112" y="130" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.6)" stroke-width="0.8"/>
      <text x="134" y="138" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
      <text x="200" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React Application</text>
      <text x="200" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Vite + TanStack</text>
      
      <!-- JWT Signer -->
      <rect x="100" y="196" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="196" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="112" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="132" y="214" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGIC</text>
      <text x="200" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">JWT Signer</text>
      <text x="200" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Connected App</text>
      
      <!-- LocalStorage -->
      <rect x="100" y="272" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="272" width="200" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="112" y="282" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
      <text x="134" y="290" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="200" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LocalStorage</text>
      <text x="200" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">zustand persist</text>
      
      <!-- REST Proxy -->
      <rect x="460" y="208" width="120" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="208" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="472" y="218" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="490" y="226" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NGINX</text>
      <text x="520" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REST Proxy</text>
      <text x="520" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/tableau-proxy</text>
      
      <!-- Tableau Cloud -->
      <rect x="620" y="320" width="120" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="320" width="120" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="632" y="330" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
      <text x="654" y="338" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
      <text x="680" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tableau Cloud</text>
      <text x="680" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST API</text>
      <text x="680" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Embedded Views</text>
      
      <!-- Legend -->
      <line x1="30" y1="440" x2="770" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      
      <line x1="160" y1="456" x2="200" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="210" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Internal call</text>
      
      <line x1="340" y1="456" x2="380" y2="456" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="390" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Primary path</text>
      
      <line x1="520" y1="456" x2="560" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="570" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">External API</text>
    </svg>
  </div>
</body>
</html>
