name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史以计算变更基线（github.event.before）
          fetch-depth: 0
      # 路径守卫：禁止内部内容（flows/amro/foc/clean-layer 等）进入公开仓库
      - name: "Guard: no internal paths"
        run: bash scripts/check-public-paths.sh
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n
      # pnpm lint 已恢复（2026-09-19）。typescript-eslint 仍不支持 TS 7 的编译器 API
      # （上游 #10940），因此按官方方案「TS 6 API 并行」配置（见 package.json 的 alias 结构）：
      #   "typescript": "npm:@typescript/typescript6@6.0.2"     ← lint 解析到的 JS API
      #   "@typescript/native": "npm:typescript@7.1.0-dev…"     ← tsc/typecheck 仍用原生 TS 7
      - run: pnpm lint
      - run: pnpm build

