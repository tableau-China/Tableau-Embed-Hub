<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Abstract workspace artwork">
  <!--
    登录页内置宣传图（public/login-hero.svg）：不依赖任何外链，离线可用。
    中间调 + 深色渐变，浅色与深色主题下都可用；配置页填了图片 URL 时由用户图取代。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141c33"/>
      <stop offset="0.5" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#0c1120"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>
  <rect width="1200" height="1500" fill="url(#glowA)"/>
  <rect width="1200" height="1500" fill="url(#glowB)"/>

  <!-- 抽象工作区骨架：示意「后台」而不是具体品牌 -->
  <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12">
    <rect x="140" y="230" width="920" height="1040" rx="28" stroke-width="2"/>
    <rect x="620" y="480" width="380" height="250" rx="18" stroke-width="2"/>
    <rect x="200" y="480" width="380" height="250" rx="18" stroke-width="2"/>
    <rect x="200" y="770" width="800" height="180" rx="18" stroke-width="2"/>
    <rect x="200" y="990" width="800" height="130" rx="18" stroke-width="2"/>
  </g>
  <g fill="#ffffff" stroke="none">
    <rect x="200" y="300" width="360" height="28" rx="14" fill-opacity="0.14"/>
    <rect x="200" y="360" width="560" height="18" rx="9" fill-opacity="0.08"/>
    <rect x="200" y="396" width="440" height="18" rx="9" fill-opacity="0.08"/>
    <rect x="240" y="1060" width="180" height="14" rx="7" fill-opacity="0.16"/>
    <rect x="240" y="1094" width="420" height="14" rx="7" fill-opacity="0.1"/>
  </g>
  <circle cx="340" cy="605" r="58" fill="#8b5cf6" fill-opacity="0.34"/>
  <circle cx="820" cy="605" r="58" fill="#38bdf8" fill-opacity="0.28"/>
</svg>
